<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Master Allocation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-zinc-900 p-8 rounded-3xl border border-zinc-800 shadow-2xl space-y-6">
    
    <!-- Cabeçalho do Login -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-emerald-400 mb-2">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-xl font-bold text-zinc-100 uppercase tracking-tight">Painel Master Pro</h1>
      <p class="text-xs text-zinc-400">Introduza as suas credenciais para aceder ao sistema</p>
    </div>

    <!-- Formulário de Acesso -->
    <form onsubmit="fazerLogin(event)" class="space-y-4">
      <div class="space-y-1">
        <label class="block text-[11px] font-bold uppercase text-zinc-400">E-mail de Acesso</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-500">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input type="email" id="email" required placeholder="seu.email@exemplo.com" class="w-full pl-10 pr-3 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-zinc-100 focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-[11px] font-bold uppercase text-zinc-400">Palavra-passe</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="senha" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-zinc-100 focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-zinc-950 font-bold text-xs uppercase tracking-wider rounded-xl transition-all flex items-center justify-center gap-2 mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel
      </button>
    </form>

    <!-- Erro de Login (Oculto por padrão) -->
    <div id="msg-erro" class="hidden p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-[11px] text-rose-400 text-center font-bold">
      E-mail ou palavra-passe incorretos.
    </div>

    <!-- Rodapé Informativo -->
    <div class="text-center pt-2 border-t border-zinc-800/80">
      <p class="text-[10px] text-zinc-500">Protegido por infraestrutura segura em nuvem e FastAPI</p>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function fazerLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      // Simulação rápida de validação (Nesta fase podes definir o teu e-mail/senha de teste)
      // No futuro, isto validará diretamente com a base de dados no Render via API.
      if (email && senha.length >= 4) {
        // Guarda um token ou estado de sessão básico no navegador
        localStorage.setItem("painel_autenticado", "true");
        localStorage.setItem("painel_usuario", email);
        
        // Redireciona para o teu painel financeiro principal (index.html)
        window.location.href = "index.html";
      } else {
        document.getElementById('msg-erro').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
