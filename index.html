<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Master Pro - Trading Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if (localStorage.getItem("painel_autenticado") !== "true") {
      window.location.href = "login.html";
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-3 sm:p-6 flex justify-center items-start">

  <div class="w-full max-w-3xl bg-zinc-900 p-5 sm:p-6 rounded-2xl border border-zinc-800 shadow-2xl space-y-5">
    
    <!-- Cabeçalho tipo Terminal -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-zinc-800 pb-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base sm:text-lg font-bold text-zinc-100 uppercase tracking-wider">Trading Desk & Analytics</h1>
          <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[9px] px-2 py-0.5 rounded font-mono font-bold">LIVE FEED</span>
        </div>
        <p class="text-[11px] text-zinc-400">Plataforma de alta performance integrada com API Python & Render</p>
      </div>
      <button onclick="fazerLogout()" class="px-2.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-rose-400 border border-zinc-700 rounded-lg text-xs font-bold transition-all flex items-center gap-1">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Sair
      </button>
    </div>

    <!-- Seletor de Ativos estilo Broker -->
    <div class="space-y-2">
      <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-400">Ativos Monitorizados</label>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="container-ativos">
        <button onclick="selecionarAtivo('VALE3')" id="btn-VALE3" class="p-2.5 bg-zinc-950 border-2 border-emerald-500 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-zinc-100">VALE3</div>
          <div class="text-[9px] text-emerald-400 font-mono">B3</div>
        </button>
        <button onclick="selecionarAtivo('PETR4')" id="btn-PETR4" class="p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-zinc-100">PETR4</div>
          <div class="text-[9px] text-zinc-400 font-mono">B3</div>
        </button>
        <button onclick="selecionarAtivo('ITUB4')" id="btn-ITUB4" class="p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-zinc-100">ITUB4</div>
          <div class="text-[9px] text-zinc-400 font-mono">B3</div>
        </button>
        <button onclick="selecionarAtivo('WEGE3')" id="btn-WEGE3" class="p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-zinc-100">WEGE3</div>
          <div class="text-[9px] text-zinc-400 font-mono">B3</div>
        </button>
        <button onclick="selecionarAtivo('BBAS3')" id="btn-BBAS3" class="p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-zinc-100">BBAS3</div>
          <div class="text-[9px] text-zinc-400 font-mono">B3</div>
        </button>
        <button onclick="selecionarAtivo('BTC')" id="btn-BTC" class="p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all">
          <div class="font-bold text-xs text-amber-400">BTC</div>
          <div class="text-[9px] text-amber-500/80 font-mono">Crypto</div>
        </button>
      </div>
    </div>

    <!-- Painel Principal de Cotação -->
    <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex justify-between items-center">
      <div>
        <div class="text-xs text-zinc-400 font-mono" id="info-setor">Mineração & Metais</div>
        <div class="text-xl font-extrabold text-emerald-400 font-mono" id="info-ticker">VALE3</div>
      </div>
      <div class="text-right">
        <div class="text-xl font-black text-zinc-100 font-mono" id="info-preco">R$ 68,50</div>
        <div class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded font-mono">Conectado à API</div>
      </div>
    </div>

    <!-- GRÁFICO ESTILO TRADING DESK (Alta Definição & Grade Escura) -->
    <div class="bg-black p-4 rounded-2xl border-2 border-zinc-800 space-y-3 shadow-inner">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          <h2 class="text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider">Gráfico de Cotação em Tempo Real</h2>
        </div>
        <div class="flex gap-1">
          <span class="text-[10px] font-mono px-2 py-0.5 bg-zinc-900 border border-zinc-800 text-emerald-400 rounded">1D</span>
          <span class="text-[10px] font-mono px-2 py-0.5 bg-zinc-900 border border-zinc-800 text-zinc-400 rounded">5D</span>
          <span class="text-[10px] font-mono px-2 py-0.5 bg-zinc-900 border border-zinc-800 text-zinc-400 rounded">1M</span>
        </div>
      </div>

      <!-- Canvas com estilo de monitor profissional -->
      <div class="w-full h-80 bg-zinc-950 p-2 rounded-xl border border-zinc-900 flex items-center justify-center relative">
        <canvas id="graficoTrading"></canvas>
      </div>
    </div>

    <!-- Módulo de Diário de Trades Rápido -->
    <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
      <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wide flex items-center gap-1.5">
        <i data-lucide="crosshair" class="w-4 h-4"></i> Gestão de Risco & Alvo (Gain 2:1)
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <div>
          <label class="block text-[9px] uppercase font-bold text-zinc-400">Entrada (R$)</label>
          <input type="number" id="trade-entrada" value="68.50" step="0.01" oninput="calcularTrade()" class="w-full p-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-zinc-100 font-mono text-center focus:outline-none">
        </div>
        <div>
          <label class="block text-[9px] uppercase font-bold text-zinc-400">Stop Loss (R$)</label>
          <input type="number" id="trade-stop" value="67.00" step="0.01" oninput="calcularTrade()" class="w-full p-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-rose-400 font-mono text-center focus:outline-none">
        </div>
        <div>
          <label class="block text-[9px] uppercase font-bold text-zinc-400">Risco Máx (R$)</label>
          <input type="number" id="trade-risco" value="150" step="10" oninput="calcularTrade()" class="w-full p-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-amber-400 font-mono text-center focus:outline-none">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 text-center pt-1">
        <div class="bg-zinc-900 p-2 rounded-lg border border-zinc-800">
          <div class="text-[9px] text-zinc-400 uppercase font-bold">Quantidade</div>
          <div id="res-qtd" class="text-xs font-mono font-bold text-zinc-100">0 un</div>
        </div>
        <div class="bg-zinc-900 p-2 rounded-lg border border-zinc-800">
          <div class="text-[9px] text-zinc-400 uppercase font-bold">Alvo (Gain)</div>
          <div id="res-alvo" class="text-xs font-mono font-bold text-emerald-400">R$ 0,00</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const API_URL = "https://painel-financeiro-api-f1cl.onrender.com/api/cotacao";

    const dadosEmpresas = {
      VALE3: { nome: "VALE3", setor: "Mineração & Metais", precoBase: 68.50, volatilidade: 0.18 },
      PETR4: { nome: "PETR4", setor: "Energia & Petróleo", precoBase: 38.20, volatilidade: 0.22 },
      ITUB4: { nome: "ITUB4", setor: "Setor Financeiro", precoBase: 32.90, volatilidade: 0.14 },
      WEGE3: { nome: "WEGE3", setor: "Bens Industriais", precoBase: 40.10, volatilidade: 0.16 },
      BBAS3: { nome: "BBAS3", setor: "Setor Bancário", precoBase: 27.50, volatilidade: 0.20 },
      BTC:   { nome: "Bitcoin (BTC)", setor: "Criptoativo", precoBase: 350000.00, volatilidade: 0.45 }
    };

    let ativoAtual = 'VALE3';
    let graficoTradeInstance = null;

    function fazerLogout() {
      localStorage.removeItem("painel_autenticado");
      window.location.href = "login.html";
    }

    async function selecionarAtivo(ticker) {
      ativoAtual = ticker;
      ['VALE3', 'PETR4', 'ITUB4', 'WEGE3', 'BBAS3', 'BTC'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (t === ticker) {
          btn.className = "p-2.5 bg-zinc-950 border-2 border-emerald-500 rounded-xl text-left transition-all";
        } else {
          btn.className = "p-2.5 bg-zinc-950 border-2 border-zinc-800 rounded-xl text-left transition-all";
        }
      });

      const info = dadosEmpresas[ticker];
      document.getElementById('info-ticker').innerText = info.nome;
      document.getElementById('info-setor').innerText = info.setor;

      try {
        const resposta = await fetch(`${API_URL}/${ticker}`);
        if (resposta.ok) {
          const dadosAPI = await resposta.json();
          info.precoBase = dadosAPI.preco_atual;
          document.getElementById('info-preco').innerText = `R$ ${dadosAPI.preco_atual.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
          renderizarGraficoTrading(info.precoBase, info.volatilidade);
        } else {
          throw new Error();
        }
      } catch (e) {
        document.getElementById('info-preco').innerText = `R$ ${info.precoBase.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        renderizarGraficoTrading(info.precoBase, info.volatilidade);
      }

      document.getElementById('trade-entrada').value = info.precoBase.toFixed(2);
      document.getElementById('trade-stop').value = (info.precoBase * 0.98).toFixed(2);
      calcularTrade();
    }

    function renderizarGraficoTrading(precoAtual, vol) {
      const ctx = document.getElementById('graficoTrading').getContext('2d');
      if (graficoTradeInstance) graficoTradeInstance.destroy();

      // Gerar dados simulados em formato decandles/linha de alta precisão estilo Terminal
      let labels = [];
      let valores = [];
      let base = precoAtual * 0.95;

      for (let i = 0; i < 20; i++) {
        labels.Item ? labels.push('') : labels.push(`T-${20-i}`);
        base += (Math.random() - 0.48) * (precoAtual * vol * 0.05);
        valores.push(Number(base.toFixed(2)));
      }
      valores[19] = precoAtual; // Garante o preço atual no fim

      graficoTradeInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cotação',
            data: valores,
            borderColor: '#10b981', // Verde estilo trading desk
            backgroundColor: 'rgba(16, 185, 129, 0.08)',
            borderWidth: 2,
            fill: true,
            tension: 0.2,
            pointRadius: 2,
            pointBackgroundColor: '#10b981'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 9, family: 'monospace' } } },
            y: { grid: { color: '#18181b' }, ticks: { color: '#71717a', font: { size: 9, family: 'monospace' } } }
          }
        }
      });
    }

    function calcularTrade() {
      const entrada = Number(document.getElementById('trade-entrada').value) || 0;
      const stop = Number(document.getElementById('trade-stop').value) || 0;
      const riscoMax = Number(document.getElementById('trade-risco').value) || 0;
      const riscoAcao = entrada - stop;

      let qtd = 0, alvo = 0;
      if (riscoAcao > 0) {
        qtd = Math.floor(riscoMax / riscoAcao);
        alvo = entrada + (riscoAcao * 2);
      }

      document.getElementById('res-qtd').innerText = `${qtd} un`;
      document.getElementById('res-alvo').innerText = alvo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 2 });
    }

    selecionarAtivo('VALE3');
  </script>
</body>
</html>
